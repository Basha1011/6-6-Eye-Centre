
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مركز 6/6 للعيون</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #edf5fc;
      color: #12345b;
      text-align: center;
    }

    /* صورة الخلفية وبها شعار المركز */
    .hero {
      width: 100%;
      height: 340px;
      background: url("background.png") center center / cover no-repeat;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 22px 14px 30px;
    }

    .section-title {
      font-size: 21px;
      margin: 8px 0 20px;
      color: #12345b;
    }

    /* شبكة المربعات */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .tile {
      min-height: 165px;
      border-radius: 22px;
      background: white;
      border: 3px solid #dceafa;
      box-shadow: 0 5px 14px #173b6418;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      padding: 12px;
      transition: transform 0.2s;
    }

    .tile:active {
      transform: scale(0.96);
    }

    .tile img {
      width: 85px;
      height: 85px;
      object-fit: contain;
    }

    .tile-name {
      font-size: 19px;
      font-weight: bold;
      margin-top: 9px;
      color: #173b68;
    }

    .vodafone {
      border-color: #ed1c24;
    }

    .instapay {
      border-color: #6334a5;
    }

    .location {
      border-color: #1680d5;
    }

    /* مربع واتساب الكبير */
    .whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-height: 125px;
      margin-top: 18px;
      border-radius: 22px;
      background: #168c55;
      color: white;
      text-decoration: none;
      font-size: 23px;
      font-weight: bold;
      box-shadow: 0 5px 14px #168c5530;
    }

    .whatsapp svg {
      width: 58px;
      height: 58px;
      fill: white;
    }

    .footer {
      background: #12345b;
      color: white;
      padding: 18px 10px;
      font-size: 14px;
    }

    @media (max-width: 360px) {
      .tile {
        min-height: 145px;
      }

      .tile img {
        width: 70px;
        height: 70px;
      }

      .tile-name {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- الخلفية فقط، بدون صورة لوجو إضافية -->
  <header class="hero"></header>

  <main class="container">

    <h2 class="section-title">وسائل الدفع ومواقع الفروع</h2>

    <div class="grid">

      <!-- فودافون كاش -->
      <a class="tile vodafone"
         href="https://vf.eg/vfcash?id=mt&qrId=vZlyRr"
         target="_blank" rel="noopener">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a6/Vodafone_icon.svg/200px-Vodafone_icon.svg.png"
          alt="Vodafone">
        <span class="tile-name">Vodafone Cash</span>
      </a>

      <!-- InstaPay -->
      <a class="tile instapay"
         href="https://ipn.eg/S/basha.grey/instapay/4ihKLN"
         target="_blank" rel="noopener">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Instapay_logo.png/240px-Instapay_logo.png"
          alt="InstaPay">
        <span class="tile-name">InstaPay</span>
      </a>

      <!-- فرع المعصرة -->
      <a class="tile location"
         href="https://maps.app.goo.gl/75ccxhW54AAD17ep6?g_st=ac"
         target="_blank" rel="noopener">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Map_pin_icon.svg/200px-Map_pin_icon.svg.png"
          alt="Google Maps">
        <span class="tile-name">المعصرة</span>
      </a>

      <!-- فرع الشوبك -->
      <a class="tile location"
         href="https://maps.app.goo.gl/EQ6ktwVcbLgLNaB29"
         target="_blank" rel="noopener">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Map_pin_icon.svg/200px-Map_pin_icon.svg.png"
          alt="Google Maps">
        <span class="tile-name">الشوبك</span>
      </a>

    </div>

    <!-- واتساب -->
    <a class="whatsapp"
       href="https://wa.me/201018226300"
       target="_blank" rel="noopener">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12.04 2C6.52 2 2.03 6.49 2.03 12.01c0 1.77.47 3.49 1.37 5.01L2 22l5.12-1.34a10 10 0 0 0 4.91 1.29h.01c5.52 0 10.01-4.49 10.01-10.01A9.95 9.95 0 0 0 19.1 4.9 9.94 9.94 0 0 0 12.04 2zm0 18.25h-.01a8.24 8.24 0 0 1-4.2-1.15l-.3-.18-3.04.8.81-2.97-.2-.31a8.23 8.23 0 1 1 6.94 3.81zm4.52-6.16c-.25-.13-1.48-.73-1.71-.81-.23-.09-.4-.13-.56.13-.17.25-.65.81-.79.98-.14.17-.29.19-.54.06-.25-.12-1.06-.39-2.02-1.25-.75-.67-1.25-1.49-1.4-1.74-.14-.25-.02-.39.11-.52.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.43-.06-.13-.56-1.35-.77-1.85-.2-.48-.41-.41-.56-.42h-.48c-.17 0-.43.06-.65.31-.23.25-.87.85-.87 2.08 0 1.23.89 2.41 1.02 2.58.13.17 1.75 2.67 4.24 3.75.59.25 1.05.4 1.41.51.59.19 1.13.16 1.56.1.48-.07 1.48-.61 1.69-1.19.21-.58.21-1.08.15-1.19-.06-.1-.23-.16-.48-.29z"/>
      </svg>

      <span>WhatsApp</span>
    </a>

  </main>

  <footer class="footer">
    مركز 6/6 للعيون .. دائماً في خدمتكم
  </footer>

</body>
</html>
