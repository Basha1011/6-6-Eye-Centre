
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مركز 6/6 للعيون</title>

  <!-- خط Changa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5faff;
      text-align: center;
      direction: rtl;
      color: #092d68;
    }

    /* الشريط العلوي */
    .top-banner {
      min-height: 80px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #061d50, #0754a6);
      border-bottom: 4px solid #16a5ed;
    }

    /* اسم المركز: ثابت مع إضاءة */
    .brand-name {
      font-family: 'Changa', sans-serif;
      font-size: 31px;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      display: inline-block;
      line-height: 1.5;
      text-shadow:
        0 2px 5px rgba(0, 0, 0, 0.2),
        0 0 15px rgba(255, 255, 255, 0.6),
        0 0 25px rgba(22, 128, 213, 0.4);
    }

    /* الصورة الرئيسية */
    .hero-image {
      width: 100%;
      display: block;
      height: auto;
    }

    /* عنوان وسائل الدفع */
    .section-title {
      font-size: 25px;
      font-weight: bold;
      color: #092d68;
      margin: 22px 10px 20px;
    }

    /* شبكة الأيقونات */
    .payment-grid {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px 20px;
      justify-items: center;
    }

    /* الدوائر بدون إطار أزرق */
    .circle {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      box-shadow: 0 4px 13px rgba(0, 91, 180, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      text-decoration: none;
    }

    .circle:active {
      transform: scale(0.96);
    }

    .circle img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    /* تصغير شعار Google Maps بنسبة 30% إضافية */
    .circle .google-logo {
      width: 49%;
      height: 49%;
    }

    /* حاوية الفرع */
    .branch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* اسم الفرع أسفل الدائرة */
    .branch-name {
      font-size: 19px;
      font-weight: bold;
      color: #092d68;
      margin: 0;
    }

    /* زر واتساب */
    .whatsapp-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: calc(100% - 40px);
      max-width: 450px;
      min-height: 75px;
      margin: 30px auto 35px;
      padding: 12px 18px;
      border-radius: 50px;
      background: #16b957;
      color: #ffffff;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 5px 14px rgba(0, 160, 75, 0.25);
      transition: transform 0.2s ease;
    }

    .whatsapp-button:active {
      transform: scale(0.97);
    }

    .whatsapp-button img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    /* التذييل */
    footer {
      background: linear-gradient(135deg, #061d50, #0754a6);
      color: #ffffff;
      padding: 22px 10px;
      font-size: 17px;
      font-weight: bold;
      border-top: 4px solid #16a5ed;
    }

    /* الهواتف الصغيرة */
    @media (max-width: 380px) {
      .brand-name {
        font-size: 29px;
      }

      .circle {
        width: 125px;
        height: 125px;
      }

      .section-title {
        font-size: 21px;
      }

      .branch-name {
        font-size: 17px;
      }

      .whatsapp-button {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- اسم المركز -->
  <header class="top-banner">
    <h1 class="brand-name">مركز 6/6 للعيون</h1>
  </header>

  <!-- الصورة الرئيسية -->
  <img
    src="background.png"
    alt="مركز 6/6 للعيون"
    class="hero-image"
  >

  <!-- وسائل الدفع والفروع -->
  <h2 class="section-title">وسائل الدفع ومواقع الفروع</h2>

  <div class="payment-grid">

    <!-- فودافون كاش -->
    <a
      class="circle"
      href="https://vf.eg/vfcash?id=mt&qrId=vZlyRr"
      target="_blank"
      rel="noopener"
      aria-label="فودافون كاش"
    >
      <img src="vodafone.png" alt="Vodafone Cash">
    </a>

    <!-- إنستاباي -->
    <a
      class="circle"
      href="https://ipn.eg/S/basha.grey/instapay/4ihKLN"
      target="_blank"
      rel="noopener"
      aria-label="إنستاباي"
    >
      <img src="instapay.png" alt="InstaPay">
    </a>

    <!-- فرع المعصرة -->
    <div class="branch-item">
      <a
        class="circle"
        href="https://maps.app.goo.gl/75ccxhW54AAD17ep6?g_st=ac"
        target="_blank"
        rel="noopener"
        aria-label="موقع فرع المعصرة"
      >
        <img class="google-logo" src="google.svg.webp" alt="Google Maps">
      </a>
      <span class="branch-name">المعصرة</span>
    </div>

    <!-- فرع الشوبك -->
    <div class="branch-item">
      <a
        class="circle"
        href="https://maps.app.goo.gl/EQ6ktwVcbLgLNaB29"
        target="_blank"
        rel="noopener"
        aria-label="موقع فرع الشوبك"
      >
        <img class="google-logo" src="google.svg.webp" alt="Google Maps">
      </a>
      <span class="branch-name">الشوبك</span>
    </div>

  </div>

  <!-- التواصل عبر واتساب -->
  <a
    class="whatsapp-button"
    href="https://wa.me/201018226300"
    target="_blank"
    rel="noopener"
  >
    <img src="whatsapp.png" alt="WhatsApp">
    <span>تواصل معنا عبر واتساب</span>
  </a>

  <!-- التذييل -->
  <footer>
    مركز 6/6 للعيون .. دائماً في خدمتكم
  </footer>

</body>
</html>
