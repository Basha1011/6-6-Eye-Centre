
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز 6/6 للعيون</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f8fc;
      color: #12345a;
      text-align: center;
    }

    /* العنوان الرئيسي */
    .top-banner {
      width: 100%;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      background: linear-gradient(120deg, #071d45, #124b91, #071d45);
      border-bottom: 4px solid #20a7ed;
      box-shadow: 0 3px 10px rgba(0, 35, 90, 0.20);
    }

    .top-banner h1 {
      margin: 0;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      font-size: clamp(24px, 4.5vw, 35px);
      font-weight: 900;
      letter-spacing: 0.3px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }

    .main {
      max-width: 600px;
      margin: auto;
      padding: 28px 16px 35px;
    }

    h2 {
      color: #123b70;
      font-size: 23px;
      margin: 5px 0 30px;
      font-weight: bold;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px 15px;
      justify-items: center;
      margin-bottom: 35px;
    }

    .service {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #163b67;
      font-size: 17px;
      font-weight: bold;
      gap: 10px;
    }

    .circle {
      width: 145px;
      height: 145px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 18px rgba(20, 55, 95, 0.13);
      overflow: hidden;
      padding: 23px;
      transition: transform 0.2s ease;
    }

    .service:active .circle {
      transform: scale(0.95);
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* تصغير شعار خرائط جوجل فقط */
    .circle .google-logo {
      width: 70%;
      height: 70%;
    }

    .whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 430px;
      min-height: 65px;
      margin: 0 auto;
      padding: 12px 18px;
      border-radius: 40px;
      background: linear-gradient(135deg, #25d366, #128c50);
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(18, 140, 80, 0.22);
    }

    .whatsapp img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    footer {
      background: #102e52;
      color: white;
      padding: 19px 10px;
      font-size: 15px;
      font-weight: bold;
    }

    @media (max-width: 380px) {
      .circle {
        width: 125px;
        height: 125px;
        padding: 20px;
      }

      h2 {
        font-size: 20px;
      }

      .service {
        font-size: 15px;
      }

      .whatsapp {
        font-size: 16px;
      }

      .top-banner {
        min-height: 68px;
      }
    }
  </style>
</head>

<body>

  <header class="top-banner">
    <h1>مركز 6/6 للعيون</h1>
  </header>

  <div class="hero">
    <img src="background.png" alt="مركز 6/6 للعيون">
  </div>

  <main class="main">

    <h2>وسائل الدفع ومواقع الفروع</h2>

    <div class="services">

      <a class="service"
         href="https://vf.eg/vfcash?id=mt&qrId=vZlyRr"
         target="_blank" rel="noopener">
        <div class="circle">
          <img src="vodafone.png" alt="Vodafone">
        </div>
      </a>

      <a class="service"
         href="https://ipn.eg/S/basha.grey/instapay/4ihKLN"
         target="_blank" rel="noopener">
        <div class="circle">
          <img src="instapay.png" alt="InstaPay">
        </div>
      </a>

      <a class="service"
         href="https://maps.app.goo.gl/75ccxhW54AAD17ep6?g_st=ac"
         target="_blank" rel="noopener">
        <div class="circle">
          <img class="google-logo" src="google.svg.webp" alt="Google Maps">
        </div>
        <span>المعصرة</span>
      </a>

      <a class="service"
         href="https://maps.app.goo.gl/EQ6ktwVcbLgLNaB29"
         target="_blank" rel="noopener">
        <div class="circle">
          <img class="google-logo" src="google.svg.webp" alt="Google Maps">
        </div>
        <span>الشوبك</span>
      </a>

    </div>

    <a class="whatsapp"
       href="https://wa.me/201018226300"
       target="_blank" rel="noopener">
      <img src="whatsapp.png" alt="واتساب">
      <span>تواصل معنا عبر واتساب</span>
    </a>

  </main>

  <footer>
    مركز 6/6 للعيون .. دائماً في خدمتكم
  </footer>

</body>
</html>
