
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز 6/6 للعيون</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(180deg, #eaf5ff, #ffffff);
  color: #12345b;
  text-align: center;
}

/* صورة الهيدر كاملة بدون قص */
.hero img {
  display: block;
  width: 100%;
  height: auto;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px 14px 30px;
}

.section-title {
  font-size: 21px;
  font-weight: bold;
  margin: 12px 0 28px;
  color: #123c78;
}

/* توزيع الدوائر */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  column-gap: 12px;
  row-gap: 28px;
}

.service {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  min-width: 0;
  padding: 4px;
}

.circle {
  width: 145px;
  height: 145px;
  max-width: 100%;
  border-radius: 50%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 7px 20px #12345b20;
  transition: transform 0.2s;
}

.service:active .circle {
  transform: scale(0.94);
}

.circle svg {
  width: 78px;
  height: 78px;
}

.service-name {
  margin-top: 13px;
  font-size: 19px;
  font-weight: bold;
  color: #173d70;
}

/* ألوان الدوائر */
.vodafone .circle {
  border: 3px solid #ed1c24;
}

.instapay .circle {
  border: 3px solid #6334a5;
}

.location .circle {
  border: 3px solid #1680d5;
}

/* شعار فودافون */
.vodafone-mark {
  width: 76px;
  height: 76px;
  border: 13px solid #e60000;
  border-radius: 50%;
  position: relative;
}

.vodafone-mark::after {
  content: "";
  position: absolute;
  width: 23px;
  height: 23px;
  background: white;
  border-radius: 50%;
  top: -8px;
  right: -8px;
}

/* شعار InstaPay */
.instapay-mark {
  font-family: Arial, sans-serif;
  font-weight: 900;
  font-size: 23px;
  font-style: italic;
  color: #54249a;
  letter-spacing: -1.5px;
}

.instapay-mark span {
  color: #f47721;
}

/* زر واتساب */
.whatsapp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  width: 100%;
  min-height: 115px;
  margin-top: 35px;
  border-radius: 70px;
  background: linear-gradient(135deg, #20b967, #087b43);
  color: white;
  text-decoration: none;
  font-size: 23px;
  font-weight: bold;
  box-shadow: 0 7px 18px #168c5540;
  transition: transform 0.2s;
}

.whatsapp:active {
  transform: scale(0.97);
}

.whatsapp svg {
  width: 57px;
  height: 57px;
  fill: white;
}

.footer {
  margin-top: 20px;
  padding: 22px 10px;
  background: #12345b;
  color: white;
  font-size: 14px;
}

@media (max-width: 380px) {
  .circle {
    width: 125px;
    height: 125px;
  }

  .circle svg {
    width: 68px;
    height: 68px;
  }

  .service-name {
    font-size: 17px;
  }

  .section-title {
    font-size: 19px;
  }
}
</style>
</head>

<body>
