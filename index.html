
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز 6/6 للعيون</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f2f7fc;
      color: #17345a;
      text-align: center;
    }

    .hero {
      background:
        linear-gradient(rgba(8, 42, 91, 0.25), rgba(8, 42, 91, 0.25)),
        url("background.png") center/cover no-repeat;
      padding: 35px 15px 40px;
    }

    .logo {
      width: 135px;
      height: 135px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
      padding: 7px;
      box-shadow: 0 4px 18px #0002;
    }

    h1 {
      color: white;
      font-size: 27px;
      margin: 16px 0 7px;
      text-shadow: 0 2px 5px #17345a;
    }

    .subtitle {
      color: white;
      font-size: 15px;
      text-shadow: 0 1px 4px #17345a;
    }

    .container {
      max-width: 480px;
      margin: auto;
      padding: 20px 16px 35px;
    }

    .section-title {
      font-size: 19px;
      margin: 12px 0 15px;
      color: #123d70;
    }

    .btn {
      display: block;
      text-decoration: none;
      color: white;
      padding: 16px 12px;
      margin: 12px 0;
      border-radius: 13px;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 3px 9px #00000012;
      transition: 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .vodafone {
      background: #e60000;
    }

    .instapay {
      background: #6435a8;
    }

    .whatsapp {
      background: #168c55;
    }

    .maps {
      background: #1765a9;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin: 18px 0;
      box-shadow: 0 3px 14px #163c6412;
    }

    .footer {
      background: #12345b;
      color: white;
      padding: 17px;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header class="hero">
    <img class="logo" src="logo.jpg" alt="شعار مركز 6/6 للعيون">

    <h1>مركز 6/6 للعيون</h1>
    <div class="subtitle">رعايتكم لصحة عيونكم تهمنا</div>
  </header>

  <main class="container">

    <section class="card">
      <h2 class="section-title">وسائل الدفع الإلكتروني</h2>

      <a class="btn vodafone"
         href="https://vf.eg/vfcash?id=mt&qrId=vZlyRr"
         target="_blank" rel="noopener">
        الدفع عن طريق فودافون كاش
      </a>

      <a class="btn instapay"
         href="https://ipn.eg/S/basha.grey/instapay/4ihKLN"
         target="_blank" rel="noopener">
        الدفع عن طريق InstaPay
      </a>
    </section>

    <section class="card">
      <h2 class="section-title">تواصل معنا</h2>

      <a class="btn whatsapp"
         href="https://wa.me/201018226300"
         target="_blank" rel="noopener">
        تواصل معنا عبر WhatsApp
      </a>
    </section>

    <section class="card">
      <h2 class="section-title">مواقع فروع المركز</h2>

      <a class="btn maps"
         href="https://maps.app.goo.gl/75ccxhW54AAD17ep6?g_st=ac"
         target="_blank" rel="noopener">
        فرع المعصرة - الموقع على الخريطة
      </a>

      <a class="btn maps"
         href="https://maps.app.goo.gl/EQ6ktwVcbLgLNaB29"
         target="_blank" rel="noopener">
        فرع الشوبك - الموقع على الخريطة
      </a>
    </section>

  </main>

  <footer class="footer">
    جميع الحقوق محفوظة © مركز 6/6 للعيون
  </footer>

</body>
</html>
