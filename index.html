
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز 6/6 للعيون</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #edf5fc;
  color: #12345b;
  text-align: center;
}

/* الخلفية وشعار المركز */
.hero {
  width: 100%;
  height: 340px;
  background-image: url("background.png");
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 22px 14px 30px;
}

.section-title {
  font-size: 21px;
  margin: 8px 0 20px;
  color: #12345b;
}

/* المربعات */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.tile {
  min-height: 165px;
  border-radius: 22px;
  background: white;
  border: 3px solid #dceafa;
  box-shadow: 0 5px 14px #173b6418;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  padding: 12px;
  transition: transform 0.2s;
}

.tile:active {
  transform: scale(0.96);
}

.tile-name {
  font-size: 19px;
  font-weight: bold;
  margin-top: 12px;
  color: #173b68;
}

.vodafone {
  border-color: #ed1c24;
}

.instapay {
  border-color: #6334a5;
}

.location {
  border-color: #1680d5;
}

/* شعار فودافون */
.vodafone-symbol {
  width: 76px;
  height: 76px;
  border: 13px solid #e60000;
  border-radius: 50%;
  position: relative;
}

.vodafone-symbol::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  background: white;
  border-radius: 50%;
  top: -8px;
  right: -7px;
}

/* شعار InstaPay */
.instapay-symbol {
  font-size: 29px;
  font-weight: 900;
  font-style: italic;
  color: #6334a5;
  letter-spacing: -2px;
}

.instapay-symbol span {
  color: #f47721;
}

/* شعار خرائط جوجل */
.map-symbol {
  width: 72px;
  height: 82px;
}

/* واتساب */
.whatsapp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  min-height: 125px;
  margin-top: 18px;
  border-radius: 22px;
  background: #168c55;
  color: white;
  text-decoration: none;
  font-size: 23px;
  font-weight: bold;
  box-shadow: 0 5px 14px #168c5530;
}

.whatsapp svg {
  width: 58px;
  height: 58px;
  fill: white;
}

.footer {
  background: #12345b;
  color: white;
  padding: 18px 10px;
  font-size: 14px;
}

@media (max-width: 360px) {
  .tile {
    min-height: 145px;
  }

  .tile-name {
    font-size: 16px;
  }

  .hero {
    height: 290px;
  }
}
</style>
</head>

<body>

<header class="hero"></header>

<main class="container">

<h2 class="section-title">وسائل الدفع ومواقع الفروع</h2>

<div class="grid">

<!-- فودافون كاش -->
<a class="tile vodafone"
href="https://vf.eg/vfcash?id=mt&qrId=vZlyRr"
target="_blank" rel="noopener">

  <div class="vodafone-symbol"></div>
  <span class="tile-name">Vodafone Cash</span>

</a>

<!-- InstaPay -->

href="https://ipn.eg/S/basha.grey/instapay/4ihKLN"
target="_blank" rel="noopener">

    INSTA<span>»</span>PAY

</div>

</main>

<footer class="footer">

</body>
</html>
