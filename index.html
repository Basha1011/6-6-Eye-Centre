<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<title>مركز 6/6 للعيون</title>

<!-- استدعاء خط Cairo الاحترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Cairo', Tahoma, Arial, sans-serif;
  background: #f4f7fb;
  color: #0f2a4a;
  text-align: center;
}

/* الهيدر ورأس الصفحة */
.hero {
  width: 100%;
  height: 320px;
  background-image: url("background.png");
  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 36px;
}

/* عناوين الأقسام */
.section-title {
  font-size: 19px;
  font-weight: 700;
  margin: 24px 0 14px;
  color: #12345b;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.section-title::before,
.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #d0dce8;
}

/* الشبكة والكروت */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.tile {
  min-height: 160px;
  border-radius: 18px;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  box-shadow: 0 8px 20px rgba(18, 52, 91, 0.06);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  padding: 16px 10px;
  transition: all 0.25s ease;
}

.tile:hover, .tile:active {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(18, 52, 91, 0.12);
  border-color: #cbd5e1;
}

.tile-name {
  font-size: 16px;
  font-weight: 700;
  margin-top: 10px;
  color: #0f2a4a;
  line-height: 1.2;
}

.tile-subtext {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
  font-weight: 500;
}

/* شعارات الفودافون وإنستاباي */
.vodafone-symbol {
  width: 58px;
  height: 58px;
  border: 10px solid #e60000;
  border-radius: 50%;
  position: relative;
}

.vodafone-symbol::after {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  background: white;
  border-radius: 50%;
  top: -6px;
  right: -5px;
}

.instapay-symbol {
  font-size: 24px;
  font-weight: 900;
  font-style: italic;
  color: #562999;
  letter-spacing: -1px;
}

.instapay-symbol span {
  color: #f47721;
}

/* خرائط جوجل */
.map-symbol {
  width: 54px;
  height: 62px;
}

.action-link {
  font-size: 12px;
  color: #1680d5;
  font-weight: 700;
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}

/* زر الواتساب */
.whatsapp {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 64px;
  margin-top: 28px;
  border-radius: 32px;
  background: #128c7e;
  color: white;
  text-decoration: none;
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(18, 140, 126, 0.25);
  transition: all 0.25s ease;
}

.whatsapp:hover, .whatsapp:active {
  background: #0e7569;
  transform: translateY(-2px);
  box-shadow: 0 10px 22px rgba(18, 140, 126, 0.35);
}

.whatsapp svg {
  width: 32px;
  height: 32px;
  fill: white;
}

.footer {
  background: #0f2a4a;
  color: #94a3b8;
  padding: 16px 10px;
  font-size: 13px;
}

@media (max-width: 360px) {
  .hero {
    height: 270px;
  }
  .tile {
    min-height: 145px;
  }
  .tile-name {
    font-size: 15px;
  }
}
</style>
</head>
